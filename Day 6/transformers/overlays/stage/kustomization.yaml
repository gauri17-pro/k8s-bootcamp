apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

nameSuffix: -stage

namespace: stage

labels:
  - pairs:
      env: stage
    includeSelectors: true
    includeTemplates: true

commonAnnotations:
  branch: stage 

replicas:
  - name: nginx-deploy
    count: 3

images:
  - name: nginx
    newName: nginx
    newTag: "1.20"

