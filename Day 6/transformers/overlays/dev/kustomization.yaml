apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

nameSuffix: -dev

namespace: dev

replicas:
  - name: nginx-deploy
    count: 1

images:
  - name: nginx
    newName: nginx
    newTag: "1.16.0"

labels:
  - pairs:
      env: dev
    includeSelectors: true
    includeTemplates: true

commonAnnotations:
  branch: dev 


